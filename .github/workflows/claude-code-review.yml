name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a code review with the following focus areas:

            1. **Correctness** — Logic errors, edge cases, off-by-one mistakes
            2. **Security** — XSS, injection, credential leaks, OWASP top 10
            3. **Performance** — Unnecessary re-renders, N+1 queries, large payloads
            4. **Code Quality** — Readability, naming, dead code, duplication
            5. **Vue/Frontend** — Reactivity issues, missing keys, accessibility
            6. **Python/Backend** — Pydantic validation, error handling, type safety

            Use inline comments for specific issues.
            Use a top-level summary comment for overall assessment.
            Be constructive and concise — flag real problems, skip style nitpicks.
